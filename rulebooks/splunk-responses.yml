---
- name: Listen for Splunk alerts
  hosts: all
  sources:
    - name: listen for alerts
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
#      filters:
#        - eda.builtin.dashes_to_underscores:

  rules:
    - name: Splunk alert about firewalld stopping
      condition: "SERVICE_STOP" in event.payload.results._raw and "firewalld" in event.payload.results._raw
      #condition: true # for testing
      #condition: event.payload is defined # for testing
      action:
        #debug:
        #  var: event.payload.results.host # for testing
        run_job_template:
          name: "a Remediate stopped firewalld"
          organization: "Ansible Product Demos (APD)"
          job_args:
            extra_vars:
              eventdata: "{{ event.payload }}"
              _hosts: "{{ event.payload.results.host }}"

    # auditd tags every write/attribute change to /etc/sudoers and
    # /etc/sudoers.d/ with key="sudoers_changes" (see splunk2eda/prep_target_host.yml).
    - name: Sudoers configuration changed
      condition: event.payload.results._raw is search("sudoers_changes")
      # A single visudo save produces several audit records; only launch
      # one job per host within the window.
      throttle:
        once_within: 5 minutes
        group_by_attributes:
          - event.payload.results.host
      action:
        run_job_template:
          name: "a Respond to sudoers change"
          organization: "Ansible Product Demos (APD)"
          job_args:
            extra_vars:
              eventdata: "{{ event.payload }}"
              _hosts: "{{ event.payload.results.host }}"

...
