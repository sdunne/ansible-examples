---
- name: Install Apache with self-signed SSL certificate on RHEL 9
  hosts: all
  become: yes

  vars:
    # Most variables come from group_vars/all.yml
    # Override with -e flag if needed: -e "website_domain=test.sdunne.net"
    cert_common_name: "{{ website_domain }}"

  tasks:
    - name: Install Apache and mod_ssl
      ansible.builtin.dnf:
        name:
          - httpd
          - mod_ssl
          - python3-cryptography
        state: present

    - name: Generate private key
      community.crypto.openssl_privatekey:
        path: "{{ ssl_key_path }}"
        size: 2048
        mode: '0600'
        owner: root
        group: root

    - name: Generate certificate signing request (CSR)
      community.crypto.openssl_csr:
        path: "/tmp/{{ cert_common_name }}.csr"
        privatekey_path: "{{ ssl_key_path }}"
        country_name: "{{ cert_country }}"
        state_or_province_name: "{{ cert_state }}"
        locality_name: "{{ cert_locality }}"
        organization_name: "{{ cert_organization }}"
        common_name: "{{ cert_common_name }}"

    - name: Generate self-signed certificate
      community.crypto.x509_certificate:
        path: "{{ ssl_cert_path }}"
        privatekey_path: "{{ ssl_key_path }}"
        csr_path: "/tmp/{{ cert_common_name }}.csr"
        provider: selfsigned
        selfsigned_not_after: "+{{ cert_validity_days }}d"
        mode: '0644'
        owner: root
        group: root
      notify: Restart Apache

    - name: Configure default HTTP catch-all virtual host
      ansible.builtin.template:
        src: templates/default-http.conf.j2
        dest: /etc/httpd/conf.d/00-default-http.conf
        mode: '0644'
      notify: Restart Apache

    - name: Configure default HTTPS catch-all virtual host
      ansible.builtin.template:
        src: templates/default-https.conf.j2
        dest: /etc/httpd/conf.d/00-default-https.conf
        mode: '0644'
      notify: Restart Apache

    - name: Configure HTTP to HTTPS redirect
      ansible.builtin.template:
        src: templates/http-redirect.conf.j2
        dest: /etc/httpd/conf.d/10-http-redirect.conf
        mode: '0644'
      notify: Restart Apache

    - name: Configure SSL virtual host
      ansible.builtin.template:
        src: templates/ssl-vhost.conf.j2
        dest: /etc/httpd/conf.d/20-ssl-vhost.conf
        mode: '0644'
      notify: Restart Apache

    - name: Read certificate details
      community.crypto.x509_certificate_info:
        path: "{{ ssl_cert_path }}"
      register: cert_info

    - name: Create sample index.html
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Configure firewall for HTTP and HTTPS
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - http
        - https
      when: ansible_facts.services['firewalld.service'] is defined and ansible_facts.services['firewalld.service'].state == 'running'

    - name: Enable and start Apache
      ansible.builtin.systemd:
        name: httpd
        enabled: yes
        state: started

  handlers:
    - name: Restart Apache
      ansible.builtin.systemd:
        name: httpd
        state: restarted
