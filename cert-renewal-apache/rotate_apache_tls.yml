---
- name: Check and rotate TLS certificate if needed
  hosts: localhost
  gather_facts: false

  vars_files:
    - secrets.yml

  tasks:
    - name: Get certificate from remote website
      community.crypto.get_certificate:
        host: "{{ website_domain }}"
        port: 443
      register: cert_info
      failed_when: false

    - name: Calculate days until expiration
      ansible.builtin.set_fact:
        days_remaining: "{{ ((cert_info.not_after | to_datetime('%Y%m%d%H%M%SZ')) - (now(utc=True))).days }}"
      when: cert_info.not_after is defined

    - name: Set rotation needed flag
      ansible.builtin.set_fact:
        needs_rotation: "{{ (cert_info.not_after is not defined) or ((days_remaining | default(0) | int) < rotation_threshold_days) }}"

    - name: Display certificate status
      ansible.builtin.debug:
        msg: |
          Domain: {{ website_domain }}
          Issuer: {{ cert_info.issuer.organizationName | default('Unknown') }}
          Subject: {{ cert_info.subject.commonName | default(website_domain) }}
          Expires: {{ cert_info.not_after | default('N/A') }}
          Days remaining: {{ days_remaining | default('N/A') }}
          Status: {% if needs_rotation %}NEEDS ROTATION{% else %}OK{% endif %}

    - name: Obtain new certificate using ACME
      ansible.builtin.include_role:
        name: acme_letsencrypt
      vars:
        domain_name: "{{ website_domain }}"
        cert_dir: "./files"
      when: needs_rotation

- name: Deploy new certificate to server
  hosts: all
  become: yes
  tasks:
    - name: Copy certificate to server
      ansible.builtin.copy:
        src: "./files/{{ website_domain }}.crt"
        dest: "{{ ssl_cert_path }}"
        mode: '0644'
        owner: root
        group: root
      notify: Restart Apache
      when: hostvars['localhost']['needs_rotation']

    - name: Copy private key to server
      ansible.builtin.copy:
        src: "./files/{{ website_domain }}.key"
        dest: "{{ ssl_key_path }}"
        mode: '0600'
        owner: root
        group: root
      notify: Restart Apache
      when: hostvars['localhost']['needs_rotation']

    - name: Read certificate details
      community.crypto.x509_certificate_info:
        path: "{{ ssl_cert_path }}"
      register: cert_info
      when: hostvars['localhost']['needs_rotation']

    - name: Update index.html with new certificate details
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
        mode: '0644'
      when: hostvars['localhost']['needs_rotation']

  handlers:
    - name: Restart Apache
      ansible.builtin.systemd:
        name: httpd
        state: restarted
