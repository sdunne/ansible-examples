---
- name: Test playbook for EDA
  hosts: "{{ _hosts | default('rhel9.sdunne.net') }}"

  tasks:
    - name: Show _hosts
      ansible.builtin.debug:
        var: _hosts

    - name: Show eventdata
      ansible.builtin.debug:
        var: eventdata

    - name: Restart firewalld
      ansible.builtin.service:
        name: firewalld
        state: started
      become: true
